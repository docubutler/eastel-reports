postgres:
  dsn: ""
  host: "localhost"
  port: 5432
  database: "anchor_iot"
  user: "your_user"
  password: "your_password"
  sslmode: "disable"

mongo:
  uri: "mongodb+srv://user:password@cluster.mongodb.net/?retryWrites=true&w=majority"
  eastel_database: "eastel-data"
  eastel_usage_collection: "usage_logs"
  eastel_usage_state_collection: "usage_log_sync_state"
  # Optional: bulk writes otherwise wait for the Atlas majority write concern.
  # "1" acknowledges on the primary only, which is safe here because an
  # interrupted batch is re-read from the checkpoint on the next run.
  # sync_write_concern: "1"

sync:
  postgres_usage_source_table: "iot_portal_tb_usage_log"
  batch_size: 2000
  write_workers: 4
  continuous: true
  poll_interval_seconds: 60
  min_record_age_seconds: 7200
  lock_timeout_seconds: 3600

logging:
  level: "INFO"
  file_path: "D:/var/logs/postgres_to_mongo_usage_sync.log"
