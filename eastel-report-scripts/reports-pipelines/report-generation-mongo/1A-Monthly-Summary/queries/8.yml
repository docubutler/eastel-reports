query_id: 8
title: International SMS
collection: '{{request_log}}'
pipeline:
- $match:
    $and:
    - rat_type: SM
    - req_time:
        $gte:
          $dateVar: start_date
    - req_time:
        $lt:
          $dateVar: end_date_exclusive
    - roaming_destination_id: 87
    - opposite_number:
        $not:
          $regex: ^60.*$
- $group:
    _id:
      rating_group: $rating_group
    __raw_mou:
      $sum: $act_update_used_volume
- $project:
    _id: 0
    rating_group: $_id.rating_group
    mou:
      $round:
      - $__raw_mou
      - 2
- $sort:
    rating_group: 1
