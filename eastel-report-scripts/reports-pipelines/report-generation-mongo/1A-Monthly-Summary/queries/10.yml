query_id: 10
title: Intl Roaming Data 5G
collection: '{{request_log}}'
pipeline:
- $match:
    $and:
    - rat_type:
        $in:
        - 5G
    - req_time:
        $gte:
          $dateVar: start_date
    - req_time:
        $lt:
          $dateVar: end_date_exclusive
    - roaming_destination_id:
        $ne: 87
- $group:
    _id:
      rat_type: $rat_type
    total_transaction:
      $sum: 1
    mou:
      $sum:
        $round:
        - $act_update_used_volume
        - 2
    mou_mbs:
      $sum:
        $round:
        - $divide:
          - $act_update_used_volume
          - 1048576
        - 2
- $project:
    _id: 0
    rat_type: $_id.rat_type
    total_transaction: 1
    mou: 1
    mou_mbs: 1
- $sort:
    rat_type: 1
