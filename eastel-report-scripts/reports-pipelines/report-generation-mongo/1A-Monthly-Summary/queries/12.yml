query_id: 12
title: Intl Roaming Voice (MT)
collection: '{{request_log}}'
pipeline:
- $match:
    $and:
    - rat_type:
        $in:
        - VO
    - service_type_sub_cd: MT
    - req_time:
        $gte:
          $dateVar: start_date
    - req_time:
        $lt:
          $dateVar: end_date_exclusive
    - roaming_destination_id:
        $ne: 87
    - opposite_number:
        $not:
          $regex: ^60.*$
- $group:
    _id:
      rat_type: $rat_type
    total_transaction:
      $sum: 1
    mou:
      $sum:
        $round:
        - $act_update_used_volume
        - 2
    mou_minutes:
      $sum:
        $round:
        - $divide:
          - $act_update_used_volume
          - 60
        - 2
- $project:
    _id: 0
    rat_type: $_id.rat_type
    total_transaction: 1
    mou: 1
    mou_minutes: 1
- $sort:
    rat_type: 1
