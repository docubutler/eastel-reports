# MongoDB connection settings.
# You can also provide these with environment variables:
# - MONGO_URI
# - MONGO_DB
mongo:
  uri: "mongodb+srv://user:password@cluster.mongodb.net/?retryWrites=true&w=majority"
  database: "eastel-data"

report_generation:
  # CSV spec/reference file used to define the report shape.
  report_spec_csv: "3-OneDay-CDR-Details.csv"
  # Mapping reference between detail categories and monthly-summary rows.
  mapping_csv: "3-OneDay-CDR-Details-Mapping.csv"
  # Output CSV generated by the report script.
  output_csv: "3-OneDay-CDR-Details-output.csv"

collections:
  usage_log: "usage_logs"
  smsc_cdr: "smsc_cdrs"

variables:
  # Inclusive start date for the report window, in YYYY-MM-DD format.
  start_date: "2026-04-01"
  # Inclusive end date for the report window, in YYYY-MM-DD format.
  # Important: set the real last day you want in the report.
  # The script automatically derives an exclusive upper bound internally
  # by adding one day, so you should NOT enter end_date + 1 here.
  end_date: "2026-04-01"
  # Optional MSISDN A filter. Leave blank to include all MSISDNs in the date range.
  msisdn_a: ""
