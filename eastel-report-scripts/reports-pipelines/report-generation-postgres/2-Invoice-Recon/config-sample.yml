postgres:
  dsn: ""
  host: "localhost"
  port: 5432
  database: "anchor_iot"
  user: "postgres"
  password: "postgres"
  sslmode: "disable"

mongo:
  uri: "mongodb+srv://username:password@easteldataanalysis.zwi2ei.mongodb.net/?appName=EastelDataAnalysis"
  database: "eastel-data"

report_generation:
  # Switch this between "usage-queries" and "request-queries".
  queries_dir: "usage-queries"
  template_xlsx: "2. CDR-Reconcialation-Report_template.xlsx"
  output_xlsx: "2-Invoice-Recon-postgres-report-July.xlsx"
  actual_quries_used_output_file: "2-Invoice-Recon-postgres-actual-queries-used.xlsx"
  daily_checkpoint_output_file: "2-Invoice-Recon-postgres-daily-checkpoints.xlsx"

tables:
  usage_log_table: "public.iot_portal_tb_usage_log"
  request_log_table: "public.iot_portal_tb_request_log"
  country_table: "public.iot_portal_tb_country"
  roaming_destination_table: "public.iot_portal_tb_roaming_destination"

collections:
  smsc_cdr: "smsc_cdrs"

variables:
  # Exclusive end_date. For full July, use 2026-08-01 00:00:00.
  start_date: "2026-07-01 00:00:00"
  end_date: "2026-08-01 00:00:00"

queries:
  Q001:
    file: "Q001.sql"
    engine: "postgres"
    output: "scalar"

