postgres:
  dsn: ""
  host: "localhost"
  port: 5432
  database: "anchor_iot"
  user: "postgres"
  password: "postgres"
  sslmode: "disable"

report_generation:
  source_queries_file: "queries.sql"
  split_queries_dir: "generated-queries"
  default_table: "iot_portal_tb_request_log"
  reports:
    - name: "active-subs"
      mode: "raw_rows"
      raw_query_id: "1"
      template_csv: "templates/recon-report-active-subs-template.csv"
      output_csv: "outputs/recon-report-active-subs.csv"
      output_columns:
        - source: "service_type"
          header: "Service Type"
        - source: "charge_type"
          header: "Charge Type"
        - source: "count_value"
          header: "Count"
    - name: "domestic-a2p-sms"
      mode: "raw_rows"
      raw_query_id: "2"
      template_csv: "templates/recon-report-domestic-a2p-sms-template.csv"
      output_csv: "outputs/recon-report-domestic-a2p-sms.csv"
      output_columns:
        - source: "service_type"
          header: "Service Type"
        - source: "charge_type"
          header: "Charge Type"
        - source: "sms_type"
          header: "SMS Type"
        - source: "no_of_sms"
          header: "No. of SMS"
    - name: "domestic-sms-voice-and-data"
      mode: "raw_rows"
      raw_query_id: "3"
      template_csv: "templates/recon-report-domestic-sms-voice-and-data-template.csv"
      output_csv: "outputs/recon-report-domestic-sms-voice-and-data.csv"
      output_columns:
        - source: "section"
          header: "Section"
        - source: "service_type"
          header: "Service Type"
        - source: "charge_type"
          header: "Charge Type"
        - source: "usage_type"
          header: "Usage Type"
        - source: "value"
          header: "Value"
    - name: "international-voice-and-sms"
      mode: "raw_rows"
      raw_query_id: "4"
      template_csv: "templates/recon-report-international-voice-and-sms-template.csv"
      output_csv: "outputs/recon-report-international-voice-and-sms.csv"
      output_columns:
        - source: "section"
          header: "Section"
        - source: "service_type"
          header: "Service Type"
        - source: "charge_type"
          header: "Charge Type"
        - source: "country"
          header: "Country"
        - source: "metric_1"
          header: "Metric 1"
        - source: "metric_2"
          header: "Metric 2"
    - name: "premium-and-special-numbers"
      mode: "raw_rows"
      raw_query_id: "5"
      template_csv: "templates/recon-report-premium-and-special-numbers-template.csv"
      output_csv: "outputs/recon-report-premium-and-special-numbers.csv"
      output_columns:
        - source: "service_type"
          header: "Service Type"
        - source: "charge_type"
          header: "Charge Type"
        - source: "call_type"
          header: "Call Type"
        - source: "no_of_calls"
          header: "No. of Calls"
        - source: "mou"
          header: "MOU"

tables:
  request_log_table: "iot_portal_tb_request_log"

variables:
  start_date: "2026-04-01"
  end_date: "2026-04-30"
